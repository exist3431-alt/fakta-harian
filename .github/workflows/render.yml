name: Render Video Fakta

on:
  push:
    paths:
      - "prompt.txt"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang library sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-liberation libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0
          fc-cache -f
          pip install -U edge-tts

      - name: Buat file proyek
        run: |
          mkdir -p src public out
          cat > package.json << 'EOF'
          {
            "name": "fakta-harian",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@remotion/cli": "4.0.250",
              "remotion": "4.0.250",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "typescript": "5.5.4",
              "@types/react": "18.3.3"
            }
          }
          EOF
          cat > tsconfig.json << 'EOF'
          {"compilerOptions":{"jsx":"react-jsx","target":"ES2020","module":"ESNext","moduleResolution":"Bundler","strict":false,"skipLibCheck":true}}
          EOF
          cat > src/index.ts << 'EOF'
          import {registerRoot} from "remotion";
          import {RemotionRoot} from "./Root";
          registerRoot(RemotionRoot);
          EOF
          cat > src/Root.tsx << 'EOF'
          import React from "react";
          import {Composition} from "remotion";
          import {Fact} from "./Composition";
          import type {Props} from "./Composition";

          const defaults: Props = {
            hook: "Did you know?",
            emoji: "",
            handle: "",
            words: [],
            segments: [],
            voiceDur: 5,
            durationFrames: 240,
            topText: "",
            bottomText: "",
          };

          export const RemotionRoot: React.FC = () => (
            <Composition
              id="Fact"
              component={Fact}
              width={1080}
              height={1920}
              fps={30}
              durationInFrames={240}
              defaultProps={defaults}
              calculateMetadata={({props}) => ({
                durationInFrames: Math.max(60, props.durationFrames),
              })}
            />
          );
          EOF
          cat > src/Composition.tsx << 'EOF'
          import React from "react";
          import {
            AbsoluteFill,
            Audio,
            OffthreadVideo,
            Sequence,
            interpolate,
            spring,
            staticFile,
            useCurrentFrame,
            useVideoConfig,
          } from "remotion";

          type Word = {text: string; start: number; end: number};
          type Seg = {src: string; fromF: number; durF: number; startF: number};
          export type Props = {
            hook: string;
            emoji: string;
            handle: string;
            words: Word[];
            segments: Seg[];
            voiceDur: number;
            durationFrames: number;
            topText: string;
            bottomText: string;
          };

          const FONT = "'Arial Black', 'Liberation Sans', Arial, sans-serif";
          const TEXT_FONT = "'Liberation Sans', Arial, sans-serif";

          const clean = (s: string) => s.replace(/[.,;:]+$/g, "");

          const Clip: React.FC<{src: string; startFrom: number}> = ({src, startFrom}) => {
            const f = useCurrentFrame();
            const zoom = interpolate(f, [0, 6], [1.07, 1], {extrapolateRight: "clamp"});
            return (
              <AbsoluteFill style={{transform: `scale(${zoom})`}}>
                <OffthreadVideo
                  src={staticFile(src)}
                  startFrom={startFrom}
                  muted
                  style={{width: "100%", height: "100%", objectFit: "cover"}}
                />
              </AbsoluteFill>
            );
          };

          export const Fact: React.FC<Props> = ({words, segments, voiceDur, durationFrames, topText, bottomText}) => {
            const f = useCurrentFrame();
            const {fps, width} = useVideoConfig();
            const t = f / fps;

            let idx = -1;
            words.forEach((w, i) => {
              if (t >= w.start - 0.03) idx = i;
            });
            const w = idx >= 0 ? words[idx] : null;
            const wf = w ? Math.max(0, f - Math.round(w.start * fps)) : 0;
            const pop = spring({frame: wf, fps, config: {damping: 12, stiffness: 260}});
            const showWord = w !== null && t < voiceDur + 0.2;
            const text = w ? clean(w.text) : "";
            const size = Math.min(124, Math.floor(900 / Math.max(1, text.length * 0.62)));

            const topIn = interpolate(f, [24, 34], [0, 1], {extrapolateLeft: "clamp", extrapolateRight: "clamp"});
            const botOut = interpolate(t, [2.8, 3.2], [1, 0], {extrapolateLeft: "clamp", extrapolateRight: "clamp"});

            return (
              <AbsoluteFill style={{background: "#000", overflow: "hidden", fontFamily: FONT}}>
                {(segments || []).map((sg, i) => (
                  <Sequence key={i} from={sg.fromF} durationInFrames={sg.durF}>
                    <Clip src={sg.src} startFrom={sg.startF} />
                  </Sequence>
                ))}

                <AbsoluteFill style={{background: "rgba(0,0,0,0.1)"}} />

                {topText ? (
                  <div
                    style={{
                      position: "absolute",
                      top: 480,
                      width,
                      boxSizing: "border-box",
                      padding: "0 90px",
                      textAlign: "center",
                      fontFamily: TEXT_FONT,
                      fontSize: 54,
                      fontWeight: 700,
                      color: "#fff",
                      textShadow: "0 3px 14px rgba(0,0,0,0.85)",
                      opacity: topIn,
                    }}
                  >
                    {topText}
                  </div>
                ) : null}

                {showWord && text ? (
                  <div
                    style={{
                      position: "absolute",
                      top: 1130,
                      width,
                      height: 200,
                      display: "flex",
                      justifyContent: "center",
                      alignItems: "center",
                      transform: `scale(${0.8 + 0.2 * pop})`,
                    }}
                  >
                    <span
                      style={{
                        fontSize: size,
                        fontWeight: 900,
                        color: "#fff",
                        WebkitTextStroke: "16px #000",
                        paintOrder: "stroke fill",
                        textShadow: "0 8px 24px rgba(0,0,0,0.45)",
                        whiteSpace: "nowrap",
                      }}
                    >
                      {text}
                    </span>
                  </div>
                ) : null}

                {bottomText && t < 3.2 ? (
                  <div
                    style={{
                      position: "absolute",
                      top: 1530,
                      width,
                      textAlign: "center",
                      fontFamily: TEXT_FONT,
                      fontSize: 50,
                      fontWeight: 600,
                      color: "#fff",
                      textShadow: "0 3px 14px rgba(0,0,0,0.85)",
                      opacity: botOut,
                    }}
                  >
                    {bottomText}
                  </div>
                ) : null}

                <Audio
                  src={staticFile("music.mp3")}
                  loop
                  volume={(fr) =>
                    interpolate(fr, [0, 20, durationFrames - 30, durationFrames], [0, 0.08, 0.08, 0], {
                      extrapolateLeft: "clamp",
                      extrapolateRight: "clamp",
                    })
                  }
                />
                <Audio src={staticFile("voice.mp3")} volume={1} />
              </AbsoluteFill>
            );
          };
          EOF
          cat > prep.py << 'EOF'
          import asyncio, glob, json, math, os, random, re, shutil, subprocess
          import urllib.parse, urllib.request
          import edge_tts

          def read_prompt(path="prompt.txt"):
              if not os.path.exists(path):
                  raise SystemExit("GAGAL: file prompt.txt tidak ditemukan di repo")
              cfg = {}
              with open(path, encoding="utf-8-sig") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line or line.startswith("#") or ":" not in line:
                          continue
                      k, v = line.split(":", 1)
                      cfg[k.strip().lower()] = v.strip()
              return cfg

          cfg = read_prompt()
          hook = cfg.get("hook", "").strip()
          fact = cfg.get("fact", "").strip()
          if not hook or not fact:
              raise SystemExit("GAGAL: isi baris 'hook:' dan 'fact:' di prompt.txt")
          topic = cfg.get("topic", "") or "Facts"
          emoji = cfg.get("emoji", "") or "💡"
          voice = cfg.get("voice", "") or "en-US-AndrewMultilingualNeural"
          handle = cfg.get("handle", "") or "@DailyFactsHub"
          footage = cfg.get("footage", "") or topic
          top_text = cfg.get("top_text", "")
          bottom_text = cfg.get("bottom_text", "")
          sumber = (cfg.get("sumber", "") or "pixabay").lower()
          if sumber.startswith(("send", "own")):
              mode = "own"
          elif sumber.startswith("pix"):
              mode = "pixabay"
          else:
              raise SystemExit("GAGAL: 'sumber:' di prompt.txt harus 'sendiri' atau 'pixabay'")

          if hook and hook[-1] not in ".?!":
              hook += "."
          text = (hook + " " + fact).strip()
          tokens = text.split()
          FPS = 30

          async def synth(v):
              try:
                  com = edge_tts.Communicate(text, v, rate="+4%", boundary="WordBoundary")
              except TypeError:
                  com = edge_tts.Communicate(text, v, rate="+4%")
              audio = bytearray()
              wb = []
              async for ch in com.stream():
                  if ch["type"] == "audio":
                      audio.extend(ch["data"])
                  elif ch["type"] == "WordBoundary":
                      off = ch["offset"] / 1e7
                      wb.append({"start": off, "end": off + ch["duration"] / 1e7})
              if not audio:
                  raise RuntimeError("tidak ada audio")
              return bytes(audio), wb

          audio = None
          for v in [voice, voice, "en-US-GuyNeural", "en-US-GuyNeural"]:
              try:
                  audio, wb = asyncio.run(synth(v))
                  print("Suara dipakai:", v)
                  break
              except Exception as e:
                  print("Gagal dengan", v, ":", e)
          if audio is None:
              raise SystemExit("Suara gagal dibuat. Jalankan ulang workflow.")

          os.makedirs("public", exist_ok=True)
          os.makedirs("out", exist_ok=True)
          with open("public/voice.mp3", "wb") as fh:
              fh.write(audio)

          r = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", "public/voice.mp3"],
              capture_output=True, text=True)
          voice_dur = float(r.stdout.strip())

          words = []
          if len(wb) == len(tokens):
              for tok, w in zip(tokens, wb):
                  words.append({"text": tok, "start": w["start"], "end": w["end"]})
          else:
              t0 = wb[0]["start"] if wb else 0.1
              t1 = wb[-1]["end"] if wb else max(voice_dur - 0.1, t0 + 1)
              weights = []
              for tok in tokens:
                  wgt = len(tok) + 1
                  if tok[-1] in ".?!":
                      wgt += 5
                  elif tok[-1] in ",;:":
                      wgt += 2
                  weights.append(wgt)
              total = sum(weights)
              cur = t0
              for tok, wgt in zip(tokens, weights):
                  d = (t1 - t0) * wgt / total
                  words.append({"text": tok, "start": cur, "end": cur + d})
                  cur += d

          TW, TH = 1080, 1920
          SEG_PATTERN = [2.4, 2.9, 2.2, 2.7]

          def cover_scale(w, h):
              return max(TW / float(w), TH / float(h))

          def http_json(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def pixabay_videos(query, key):
              q = urllib.parse.quote(query[:100])
              url = "https://pixabay.com/api/videos/?key=" + key + "&q=" + q + "&video_type=film&min_width=1080&per_page=40&safesearch=true"
              try:
                  data = http_json(url, {"User-Agent": "Mozilla/5.0"})
              except Exception as e:
                  print("Pixabay gagal:", e)
                  return []
              items = []
              for h in data.get("hits", []):
                  files = []
                  for name in ["large", "medium", "small", "tiny"]:
                      x = (h.get("videos") or {}).get(name) or {}
                      if x.get("url") and x.get("width") and x.get("height"):
                          files.append({"link": x["url"], "w": x["width"], "h": x["height"], "size": x.get("size", 0) or 0})
                  if files:
                      items.append({"source": "Pixabay", "dur": float(h.get("duration", 6)), "files": files})
              return items

          def best_file(files):
              ok = [f for f in files if cover_scale(f["w"], f["h"]) <= 1.12 and f["size"] <= 150 * 1024 * 1024]
              return min(ok, key=lambda f: f["w"] * f["h"]) if ok else None

          def probe_dur(path):
              r = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", path],
                                 capture_output=True, text=True)
              try:
                  return float(r.stdout.strip())
              except Exception:
                  return 0.0

          def make_clip(src, name, maxdur):
              vf = "scale=%d:%d:force_original_aspect_ratio=increase:flags=lanczos,crop=%d:%d,fps=30,setsar=1" % (TW, TH, TW, TH)
              subprocess.run(["ffmpeg", "-y", "-v", "error", "-i", src, "-t", "%.2f" % maxdur, "-vf", vf,
                              "-an", "-c:v", "libx264", "-crf", "16", "-preset", "medium",
                              "-pix_fmt", "yuv420p", "-movflags", "+faststart", "public/" + name], check=True)
              return probe_dur("public/" + name)

          def windows(proc, j0):
              out, t, j = [], 0.0, j0
              while True:
                  d = SEG_PATTERN[j % len(SEG_PATTERN)]
                  if t + d + 0.3 > proc:
                      break
                  out.append((t, d))
                  t += d
                  j += 1
              if not out:
                  out.append((0.0, max(1.2, proc - 0.3)))
              return out

          def build_segments(clips, total):
              for ci, c in enumerate(clips):
                  c["wins"] = windows(c["dur"], ci)
              order, k = [], 0
              while True:
                  added = False
                  for ci, c in enumerate(clips):
                      if k < len(c["wins"]):
                          order.append((ci, c["wins"][k]))
                          added = True
                  if not added:
                      break
                  k += 1
              total_f = int(math.ceil(total * FPS))
              segs, cur_f, i = [], 0, 0
              while cur_f < total_f:
                  ci, (st, d) = order[i % len(order)]
                  dur_f = max(1, int(round(d * FPS)))
                  segs.append({"src": clips[ci]["src"], "fromF": cur_f, "durF": dur_f, "startF": int(round(st * FPS))})
                  cur_f += dur_f
                  i += 1
              return segs

          def collect_own():
              exts = (".mp4", ".mov", ".m4v", ".webm", ".mkv")
              files = sorted(p for p in glob.glob("footage/*") if p.lower().endswith(exts))
              random.shuffle(files)
              clips = []
              for p in files[:8]:
                  name = "clip%d.mp4" % len(clips)
                  try:
                      d = make_clip(p, name, 20.0)
                      if d >= 1.5:
                          clips.append({"src": name, "dur": d, "source": "own"})
                          print("Klip sendiri siap:", p, round(d, 1), "detik")
                  except Exception as e:
                      print("Klip sendiri gagal:", p, e)
              return clips

          def fetch_footage(query, total, mode):
              if mode == "own":
                  own = collect_own()
                  if not own:
                      raise SystemExit("GAGAL: sumber 'sendiri' dipilih, tapi folder footage kosong atau klipnya tidak terbaca. Unggah klip ke folder footage.")
                  return build_segments(own, total), ["own"]

              xk = os.environ.get("PIXABAY_API_KEY", "").strip()
              if not xk:
                  raise SystemExit("GAGAL: PIXABAY_API_KEY belum diisi di Settings > Secrets and variables > Actions")
              vids = pixabay_videos(query, xk)
              random.shuffle(vids)
              pool = [p for p in vids if p["dur"] >= 5 and best_file(p["files"])]
              if not pool:
                  raise SystemExit("GAGAL: tidak ada footage kualitas tinggi (min. Full HD) untuk kata kunci: " + query + ". Ganti baris 'footage:' di prompt.txt.")

              need = min(6, max(3, int(math.ceil(total / 8.0))))
              clips = []
              tried = 0
              for p in pool:
                  if len(clips) >= need or tried >= 14:
                      break
                  tried += 1
                  f = best_file(p["files"])
                  raw = "raw%d.mp4" % tried
                  name = "clip%d.mp4" % len(clips)
                  try:
                      req = urllib.request.Request(f["link"], headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=120) as resp, open(raw, "wb") as out:
                          shutil.copyfileobj(resp, out)
                      d = make_clip(raw, name, min(p["dur"], 12.0))
                      if d >= 1.5:
                          clips.append({"src": name, "dur": d, "source": "Pixabay"})
                          print("Footage siap:", name, "Pixabay sumber", f["w"], "x", f["h"])
                  except Exception as e:
                      print("Klip gagal diproses:", e)
                  finally:
                      if os.path.exists(raw):
                          os.remove(raw)
              if not clips:
                  raise SystemExit("GAGAL: tidak ada klip yang berhasil diunduh. Jalankan ulang atau ganti kata kunci.")
              return build_segments(clips, total), ["Pixabay"]

          frames = int(math.ceil((voice_dur + 0.6) * FPS))
          segments, sources = fetch_footage(footage, frames / float(FPS), mode)
          props = {"hook": hook, "emoji": emoji, "handle": handle, "words": words, "segments": segments,
                   "topText": top_text, "bottomText": bottom_text,
                   "voiceDur": voice_dur, "durationFrames": frames}
          with open("props.json", "w", encoding="utf-8") as fh:
              json.dump(props, fh, ensure_ascii=False)

          def ts(s):
              ms = int(round(s * 1000))
              return "%02d:%02d:%02d,%03d" % (ms // 3600000, ms // 60000 % 60, ms // 1000 % 60, ms % 1000)

          lines, cur_l = [], []
          for w in words:
              cur_l.append(w)
              if len(cur_l) >= 6 or w["text"][-1] in ".?!":
                  lines.append(cur_l)
                  cur_l = []
          if cur_l:
              lines.append(cur_l)
          srt = []
          for i, ln in enumerate(lines, 1):
              srt.append("%d\n%s --> %s\n%s\n" % (i, ts(ln[0]["start"]), ts(ln[-1]["end"] + 0.2), " ".join(x["text"] for x in ln)))
          with open("out/captions.srt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(srt))

          topic_tag = "".join(x.capitalize() for x in re.sub(r"[^A-Za-z0-9 ]", "", topic).split())
          base = ["facts", "didyouknow", "dailyfacts", "funfacts", "trivia", "mindblown", "learnontiktok", "fyp"]
          tags = ([topic_tag.lower()] if topic_tag else []) + base
          hashtags = " ".join("#" + x for x in tags[:8])
          title = (hook.rstrip(".") + " " + emoji)
          if len(title) > 80:
              title = title[:77].rstrip() + "..."
          title += " #Shorts"
          credit = "" if "own" in sources else "\n\nFootage: " + ", ".join(sources)
          desc = (hook + " " + fact + "\n\nFollow " + handle + " for a new fact every day!" + credit + "\n\n" + hashtags + " #shorts")
          tiktok = hook + " " + emoji + " " + " ".join("#" + x for x in tags[:6])
          meta = ("=== YOUTUBE SHORTS ===\nJUDUL:\n" + title + "\n\nDESKRIPSI:\n" + desc +
                  "\n\nTAGS (isi di kolom tag):\n" + ", ".join(tags) +
                  "\n\n=== TIKTOK ===\nCAPTION:\n" + tiktok +
                  "\n\nTIPS: unggah captions.srt di YouTube (Subtitles) untuk SEO tambahan.\n")
          with open("out/metadata.txt", "w", encoding="utf-8") as fh:
              fh.write(meta)
          print("Durasi suara:", voice_dur, "detik; total frame:", frames)
          EOF

      - name: Buat suara AI, data, dan musik
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python prep.py
          if [ -f music.mp3 ]; then
            cp music.mp3 public/music.mp3
          else
            ffmpeg -y -v error -f lavfi -i "sine=f=110:d=75" -f lavfi -i "sine=f=164.81:d=75" -f lavfi -i "sine=f=220:d=75" -f lavfi -i "sine=f=277.18:d=75" -filter_complex "amix=inputs=4,tremolo=f=0.25:d=0.4,lowpass=f=1200,volume=3,afade=t=in:d=2" public/music.mp3
          fi
          ls -la public out

      - name: Pasang Remotion
        run: npm install

      - name: Render video
        run: npx remotion render src/index.ts Fact out/video.mp4 --props=props.json --crf=16 --jpeg-quality=95 --x264-preset=slow --timeout=120000

      - uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: |
            out/video.mp4
            out/metadata.txt
            out/captions.srt
