name: Render Video
on:
  workflow_dispatch:
    inputs:
      hook:
        description: "Kalimat pembuka"
        default: "Did you know?"
      fact:
        description: "Isi fakta (bahasa Inggris)"
        default: "Octopuses have three hearts and blue blood."
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ inputs.hook }}
      FACT: ${{ inputs.fact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang library sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0
      - name: Buat file proyek
        run: |
          mkdir -p src
          cat > package.json << 'EOF'
          {
            "name": "fakta-harian",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@remotion/cli": "4.0.250",
              "remotion": "4.0.250",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "typescript": "5.5.4",
              "@types/react": "18.3.3"
            }
          }
          EOF
          cat > tsconfig.json << 'EOF'
          {"compilerOptions":{"jsx":"react-jsx","target":"ES2020","module":"ESNext","moduleResolution":"Bundler","strict":false,"skipLibCheck":true}}
          EOF
          cat > src/index.ts << 'EOF'
          import {registerRoot} from "remotion";
          import {RemotionRoot} from "./Root";
          registerRoot(RemotionRoot);
          EOF
          cat > src/Root.tsx << 'EOF'
          import {Composition} from "remotion";
          import {Fact} from "./Composition";
          export const RemotionRoot = () => (
            <Composition
              id="Fact"
              component={Fact}
              durationInFrames={450}
              fps={30}
              width={1080}
              height={1920}
              defaultProps={{hook: "Did you know?", fact: "Honey never spoils."}}
            />
          );
          EOF
          cat > src/Composition.tsx << 'EOF'
          import {AbsoluteFill, interpolate, Sequence, useCurrentFrame} from "remotion";
          import type {ReactNode} from "react";
          const Fade = ({children}: {children: ReactNode}) => {
            const f = useCurrentFrame();
            const opacity = interpolate(f, [0, 15], [0, 1], {extrapolateRight: "clamp"});
            return (
              <AbsoluteFill style={{justifyContent: "center", alignItems: "center", padding: 80, opacity}}>
                {children}
              </AbsoluteFill>
            );
          };
          export const Fact = ({hook, fact}: {hook: string; fact: string}) => (
            <AbsoluteFill style={{background: "linear-gradient(160deg,#1e3a8a,#7c3aed)", fontFamily: "Arial, sans-serif", textAlign: "center"}}>
              <Sequence from={0} durationInFrames={90}>
                <Fade><h1 style={{color: "#fde047", fontSize: 130}}>{hook}</h1></Fade>
              </Sequence>
              <Sequence from={90}>
                <Fade><p style={{color: "white", fontSize: 72, lineHeight: 1.3}}>{fact}</p></Fade>
              </Sequence>
            </AbsoluteFill>
          );
          EOF
      - run: npm install
      - name: Siapkan teks
        run: node -e 'require("fs").writeFileSync("props.json", JSON.stringify({hook: process.env.HOOK, fact: process.env.FACT}))'
      - name: Render video
        run: npx remotion render src/index.ts Fact out/video.mp4 --props=props.json
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
